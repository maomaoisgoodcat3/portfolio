name: Sync stats

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: be/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r be/requirements.txt

      - name: Sync GitHub stats
        working-directory: be
        env:
          DATABASE_URL: ${{ secrets.STATS_DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          STATS_GITHUB_ACCOUNTS: maomaoisgoodcat3
        run: python -m app.sync
