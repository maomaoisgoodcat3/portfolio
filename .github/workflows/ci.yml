name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: Portfolio API
      APP_ENV: development
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: portfolio_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: be/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r be/requirements.txt

      - name: Install backend test tools
        run: python -m pip install ruff==0.17.4 pytest==9.2.0 httpx==0.28.1

      - name: Generate Fernet key
        shell: bash
        run: |
          key="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          printf 'TOTP_ENC_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Run Ruff
        run: ruff check be

      - name: Run backend tests
        working-directory: be
        run: pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install frontend dependencies
        working-directory: fe
        run: npm ci

      - name: Run frontend lint
        working-directory: fe
        run: npm run lint

      - name: Run TypeScript checks
        working-directory: fe
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: fe
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit frontend dependencies
        working-directory: fe
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit backend dependencies
        run: pip-audit -r be/requirements.txt
